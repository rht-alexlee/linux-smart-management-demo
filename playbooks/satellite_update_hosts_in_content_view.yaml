- name: Manage satellite
  hosts: localhost
  connection: local
  tasks:
    - name: Get content view info
      register: content_view_result
      redhat.satellite.content_view_info:
        server_url: "{{ satellite_config.url }}"
        organization: "{{ satellite_config.organization }}"
        username: "{{ satellite_config.username }}"
        password: "{{ satellite_config.password }}"
        validate_certs: "{{ satellite_config.verify }}"
        name: "{{ content_view }}"

    - name: Print content view info
      ansible.builtin.debug:
        msg: "{{ content_view_result }}"

    - name: Get hosts of environment
      ansible.builtin.set_fact:
        hosts_ids_in_environment: "{{ content_view_result.content_view.environments | selectattr('name', 'equalto', selected_environment) | map(attribute='hosts') | first }}"

    - name: Print content view info
      ansible.builtin.debug:
        msg: "{{ hosts_ids_in_environment }}"

    - name: Get hosts of environment
      ansible.builtin.set_fact:
        target_host_list: "{{ content_view_result.content_view.hosts | selectattr('id', 'in', hosts_ids_in_environment) | map(attribute='name') | list }}"

    - name: Print content view info
      ansible.builtin.debug:
        msg: "{{ target_host_list }}"

    - name: Add host
      loop: "{{ target_host_list }}"
      ansible.builtin.add_host:
        name: "{{ item }}"
        group: target_upgrade_group

- name: Run tasks on target_upgrade_group
  hosts: target_upgrade_group
  gather_facts: true
  tasks:
    - name: Update all packages
      when: not (security_only | bool)
      become: true
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true

    - name: Update security packages only
      when: (security_only | bool)
      become: true
      ansible.builtin.dnf:
        name: "*"
        state: latest
        security: true
        update_cache: true

    - name: Check if reboot is required
      register: reboot_required
      ignore_errors: yes
      failed_when: false
      changed_when: false
      ansible.builtin.command:
        cmd: "needs-restarting -r"

    - name: No reboot is required
      when: reboot_required.rc == 0
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} don't need to reboot"

    - name: Print hosts that needs to be rebooted manually
      when:
        - reboot_required.rc == 1
        - not (can_reboot | bool)
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} needs to be rebooted manually after patch"

    - name: Reboot
      when: reboot_required.rc == 1 and (can_reboot | bool)
      ansible.builtin.reboot:
        msg: "{{ inventory_hostname }} will be rebooted by Ansible after patch update"
